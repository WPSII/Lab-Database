{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-body">
      <h4 class="mb-3">Edit Profile</h4>
      <form method="post" action="{{ url_for('edit_profile') }}">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" value="{{ user.email }}" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" name="name" value="{{ user.name or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input class="form-control" name="title" value="{{ user.title or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input class="form-control" name="phone" value="{{ user.phone or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Organization</label>
          <input class="form-control" name="organization" value="{{ user.organization or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Bio</label>
          <textarea class="form-control" name="bio" rows="4">{{ user.bio or '' }}</textarea>
        </div>
        <button class="btn btn-primary">Save Profile</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
