{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Profile</h4>
        {% if is_owner %}
          <a class="btn btn-primary" href="{{ url_for('edit_profile') }}">Edit Profile</a>
        {% endif %}
      </div>
      <dl class="row mb-0">
        <dt class="col-sm-4">Name</dt><dd class="col-sm-8">{{ user.name or '—' }}</dd>
        <dt class="col-sm-4">Email</dt><dd class="col-sm-8">{{ user.email }}</dd>
        <dt class="col-sm-4">Title</dt><dd class="col-sm-8">{{ user.title or '—' }}</dd>
        <dt class="col-sm-4">Phone</dt><dd class="col-sm-8">{{ user.phone or '—' }}</dd>
        <dt class="col-sm-4">Organization</dt><dd class="col-sm-8">{{ user.organization or '—' }}</dd>
        <dt class="col-sm-4">Bio</dt><dd class="col-sm-8" style="white-space: pre-wrap;">{{ user.bio or '—' }}</dd>
      </dl>
    </div>
  </div>
</div>
{% endblock %}
